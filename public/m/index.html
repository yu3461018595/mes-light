<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>智工 · 扫码报工</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f2f4f8; color: #1f2733; -webkit-text-size-adjust: 100%; }
  .top { background: #1d4ed8; color: #fff; padding: 14px 16px; font-size: 16px; font-weight: 600;
    display: flex; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 5; }
  .top .dot { width: 9px; height: 9px; border-radius: 50%; background: #7ee0a8; box-shadow: 0 0 0 3px rgba(126,224,168,.35); }
  .wrap { padding: 14px; max-width: 560px; margin: 0 auto; }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 2px 10px rgba(20,40,80,.06); margin-bottom: 14px; overflow: hidden; }
  .card-h { padding: 14px 16px 0; font-weight: 700; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  .card-b { padding: 12px 16px 16px; }
  .ocode { font-size: 20px; font-weight: 800; letter-spacing: .5px; }
  .pname { color: #5a6673; font-size: 14px; margin-top: 2px; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .b-released { background: #e8efff; color: #1d4ed8; } .b-running { background: #e6f6ee; color: #0f9d58; }
  .b-paused { background: #fff3e0; color: #e08a00; } .b-done, .b-closed { background: #eef1f5; color: #6b7682; }
  .bar { height: 9px; background: #eef1f5; border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg,#1d4ed8,#4f7df0); }
  .prog-txt { display: flex; justify-content: space-between; font-size: 13px; color: #5a6673; margin-top: 8px; }
  .step { border: 1.5px solid #e6eaf0; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .step.active { border-color: #1d4ed8; background: #f5f8ff; }
  .step.done { opacity: .55; }
  .step .nm { font-weight: 700; font-size: 15px; }
  .step .sub { font-size: 12.5px; color: #6b7682; margin-top: 3px; }
  .field { margin-bottom: 14px; }
  .field > span { display: block; font-size: 13px; color: #5a6673; margin-bottom: 6px; font-weight: 600; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 52px; height: 52px; border-radius: 12px; border: none; background: #eef1f5; color: #1d4ed8;
    font-size: 26px; font-weight: 700; flex: 0 0 auto; }
  .stepper input { flex: 1; height: 52px; border: 1.5px solid #e6eaf0; border-radius: 12px; text-align: center;
    font-size: 22px; font-weight: 700; -webkit-appearance: none; }
  select, input[type=date], textarea { width: 100%; height: 48px; border: 1.5px solid #e6eaf0; border-radius: 12px;
    padding: 0 12px; font-size: 15px; background: #fff; -webkit-appearance: none; }
  textarea { height: 70px; padding: 10px 12px; resize: none; }
  .btn { width: 100%; height: 54px; border: none; border-radius: 14px; font-size: 17px; font-weight: 700;
    background: #1d4ed8; color: #fff; }
  .btn:active { transform: translateY(1px); } .btn.ghost { background: #eef1f5; color: #5a6673; }
  .btn[disabled] { opacity: .5; }
  .ord { display: flex; align-items: center; justify-content: space-between; padding: 14px; border-bottom: 1px solid #f0f2f6; }
  .ord:active { background: #f5f8ff; }
  .toast2 { position: fixed; left: 50%; top: 42%; transform: translate(-50%,-50%); background: rgba(0,0,0,.82);
    color: #fff; padding: 16px 22px; border-radius: 12px; font-size: 15px; z-index: 30; max-width: 80%; text-align: center; }
  .ok-mask { position: fixed; inset: 0; background: rgba(255,255,255,.97); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; z-index: 40; padding: 24px; }
  .ok-circle { width: 96px; height: 96px; border-radius: 50%; background: #0f9d58; display: flex; align-items: center; justify-content: center; }
  .ok-circle svg { width: 52px; height: 52px; fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
  .muted { color: #8b96a3; } .center { text-align: center; }
  .back { background: rgba(255,255,255,.2); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; }
  .pick-hint { font-size: 13px; color: #8b96a3; margin: 4px 2px 10px; }
  .flow-tip { border: 1.5px solid #cfe0ff; background: #f5f8ff; color: #1d3c7a; border-radius: 10px;
    padding: 8px 12px; font-size: 13px; line-height: 1.6; margin-bottom: 14px; }
  .flow-tip b { font-variant-numeric: tabular-nums; }
  .flow-tip.over { border-color: #f0c2c2; background: #fdecec; color: #d93b3b; }
</style>
</head>
<body>
  <div class="top">
    <button class="back" id="back" style="display:none" aria-label="返回">‹</button>
    <span class="dot"></span><span>智工 · 扫码报工</span>
  </div>
  <div class="wrap" id="app">加载中…</div>
  <script src="/lib/qrcode.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/m/app.js"></script>
</body>
</html>
