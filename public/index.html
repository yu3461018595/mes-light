<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>智工 · 生产管理系统</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231d4ed8'/><path d='M28 66V34h18a12 12 0 0 1 0 24H36v8z' fill='white'/></svg>">
</head>
<body>

<!-- 登录 -->
<div id="login" class="login">
  <div class="login-box">
    <div class="login-brand">
      <div class="login-logo">智</div>
      <div>
        <h1>智工 · 生产管理</h1>
        <p>工单 · 报工 · 看板 · 质量</p>
      </div>
    </div>
    <form id="loginForm" autocomplete="off">
      <label class="field">
        <span>账号</span>
        <input id="lgUser" value="admin" placeholder="请输入账号" autocomplete="username">
      </label>
      <label class="field">
        <span>密码</span>
        <input id="lgPwd" type="password" value="123456" placeholder="请输入密码" autocomplete="current-password">
      </label>
      <button class="btn btn-primary btn-block btn-lg" type="submit">登 录</button>
      <div class="login-tip">
        演示账号：admin / leader1 / worker1，密码均为 <b>123456</b>
      </div>
    </form>
  </div>
</div>

<!-- 主体 -->
<div id="shell" class="app hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">智</div>
      <div class="brand-text"><b>智工生产</b><small>MES Lite</small></div>
    </div>
    <nav id="menu" class="menu"></nav>
    <div class="side-foot">
      <div id="sideUser" class="side-user"></div>
      <button class="btn btn-ghost btn-sm btn-block" id="btnReset">重置本地数据</button>
      <button class="btn btn-ghost btn-sm btn-block" id="btnLogout">退出登录</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btnBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <h2 id="pageTitle">看板</h2>
      <div class="topbar-right">
        <span id="topDate" class="top-date"></span>
        <span id="topUser" class="chip chip-blue"></span>
      </div>
    </header>
    <main id="view" class="content"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script src="lib/qrcode.js"></script>
<script src="js/store.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/orders.js"></script>
<script src="js/views/report.js"></script>
<script src="js/views/basic.js"></script>
<script src="js/views/scan.js"></script>
<script src="js/views/stats.js"></script>
<script src="js/app.js"></script>
</body>
</html>
