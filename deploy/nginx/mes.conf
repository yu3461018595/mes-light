# MES-Light Nginx 反代配置
# 放到 /etc/nginx/conf.d/mes.conf
# 步骤：
#   1) 把下面 server_name 的 CHANGE-ME.example.com 改成你的真实域名
#   2) nginx -t && systemctl reload nginx
#   3) 用 certbot 申请证书：certbot --nginx -d 你的域名
#      certbot 会自动补上 443 监听与 SSL 配置，微信扫码打开必须有 HTTPS
server {
    listen 80;
    server_name CHANGE-ME.example.com;

    # 微信内打开必须 HTTPS；先保留 80 用于 certbot 签发证书
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
